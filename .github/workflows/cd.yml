name: CD Deploy

# Deployment only:
# Run after CI workflow completes on main, then publish images and trigger Coolify.
on:
  workflow_run:
    workflows:
      - "Pull Request CI Checks"
    types:
      - completed
    branches:
      - main

# Ensure only one production deployment runs at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build, Publish, and Deploy (Production)
    runs-on: ubuntu-latest
    environment: production

    # Only deploy when the upstream CI workflow finished successfully.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    # Least-privilege permissions:
    # - contents:read for checkout
    # - packages:write to push images to GHCR
    permissions:
      contents: read
      packages: write

    env:
      # Fixed GHCR image names for this repository.
      BACKEND_IMAGE: ghcr.io/lucaknobel/ticket-system-backend
      FRONTEND_IMAGE: ghcr.io/lucaknobel/ticket-system-frontend
      IMAGE_TAG_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # Check out the exact commit that CI validated.
      # fetch-depth: 2 is sufficient because change detection compares
      # the validated commit to the previous commit on main.
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      # Detect which service images require rebuild using the official
      # path-filter action.
      #
      # Why this base/ref configuration is correct:
      # - This workflow only runs for successful CI on main.
      # - For non-push events (workflow_run), dorny/paths-filter v4 supports
      #   long-lived branch detection by setting `base` to the branch name.
      # - With `base: main` and `ref` set to the validated commit SHA,
      #   changes are evaluated against the previous commit on main,
      #   matching the intended deployment behavior.
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v4.0.3
        with:
          base: main
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'

      # Prepare Docker Buildx for reproducible multi-context builds.
      - name: Set up Docker Buildx
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v4

      # Authenticate to GHCR using the automatically provided GITHUB_TOKEN.
      - name: Login to GitHub Container Registry
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push backend image with production tags:
      # - latest
      # - commit SHA
      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          # Both Dockerfiles require repository root as build context.
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}

      # Build and push frontend image with production tags:
      # - latest
      # - commit SHA
      - name: Build and push frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          # Both Dockerfiles require repository root as build context.
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}

      # Trigger one Coolify deployment only when at least one image was rebuilt and pushed.
      # Coolify deployment webhook must be requested as GET with bearer auth.
      - name: Trigger Coolify deploy webhook
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          DEPLOY_KEY_TICKET_SYSTEM: ${{ secrets.DEPLOY_KEY_TICKET_SYSTEM }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${DEPLOY_KEY_TICKET_SYSTEM}" \
            "${COOLIFY_WEBHOOK_URL}"

      # Explicitly report when deployment is intentionally skipped.
      - name: Skip deployment (no relevant changes)
        if: steps.changes.outputs.backend != 'true' && steps.changes.outputs.frontend != 'true'
        run: |
          echo "No backend/frontend/shared/lockfile changes detected."
          echo "Skipping image builds and Coolify deploy."

      # Keep a concise summary for traceability in workflow logs.
      - name: Deployment summary
        run: |
          echo "Deployment environment: production"
          echo "Commit SHA tag: ${IMAGE_TAG_SHA}"
          echo "Backend changed: ${{ steps.changes.outputs.backend }}"
          echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
          if [[ "${{ steps.changes.outputs.backend }}" == "true" || "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            echo "Any image rebuilt: true"
          else
            echo "Any image rebuilt: false"
          fi
          echo "Backend image: ${BACKEND_IMAGE}:${IMAGE_TAG_SHA}"
          echo "Frontend image: ${FRONTEND_IMAGE}:${IMAGE_TAG_SHA}"
