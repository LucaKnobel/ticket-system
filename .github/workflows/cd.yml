name: CD Deploy

# Deployment only:
# Run directly on push to main after PR CI and branch protection have already
# validated the merge, then publish images and trigger Coolify.
on:
  push:
    branches:
      - main

# Ensure only one production deployment runs at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed image targets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      # Check out the pushed merge commit from main.
      # fetch-depth: 2 is sufficient because change detection compares
      # the merge commit to its previous commit on main.
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      # Detect which service images require rebuild using the official
      # path-filter action.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: changes

    if: needs.changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: write

    env:
      BACKEND_IMAGE: ghcr.io/lucaknobel/ticket-system-backend
      IMAGE_TAG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image exactly once and load it into the local Docker daemon
      # so Trivy can scan the same artifact before we push it.
      # load:true is intentional because we scan the exact local image first.
      # This workflow currently builds linux/amd64 only.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}

      # Informative security scan for locally built image.
      # This step does not fail deployment because the base image may contain
      # known vulnerabilities that are handled separately.
      - name: Scan backend image with Trivy (log)
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: "image"
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          list-all-pkgs: false
          exit-code: "0"

      - name: Generate backend Trivy report (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: "image"
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          format: "json"
          output: "trivy-backend-report.json"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          list-all-pkgs: false
          exit-code: "0"

      - name: Upload backend Trivy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report-${{ github.sha }}
          path: trivy-backend-report.json

      - name: Backend Trivy summary
        run: |
          critical_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-backend-report.json)
          {
            echo "## Trivy Summary - Backend"
            echo ""
            echo "- Image Name: `${BACKEND_IMAGE}`"
            echo "- Image Tag: `${IMAGE_TAG_SHA}`"
            echo "- Critical Findings: ${critical_count}"
            echo "- Hinweis: Details stehen im Trivy-Report-Artifact und im Trivy-Logscan."
          } >> "$GITHUB_STEP_SUMMARY"

      # Push the exact already-built image once the scan passed.
      - name: Push backend image
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG_SHA}"
          docker push "${BACKEND_IMAGE}:latest"

  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: write

    env:
      FRONTEND_IMAGE: ghcr.io/lucaknobel/ticket-system-frontend
      IMAGE_TAG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image exactly once and load it into the local Docker daemon
      # so Trivy can scan the same artifact before we push it.
      # load:true is intentional because we scan the exact local image first.
      # This workflow currently builds linux/amd64 only.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}

      # Informative security scan for locally built image.
      # This step does not fail deployment because the base image may contain
      # known vulnerabilities that are handled separately.
      - name: Scan frontend image with Trivy (log)
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: "image"
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          list-all-pkgs: false
          exit-code: "0"

      - name: Generate frontend Trivy report (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: "image"
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          format: "json"
          output: "trivy-frontend-report.json"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          list-all-pkgs: false
          exit-code: "0"

      - name: Upload frontend Trivy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report-${{ github.sha }}
          path: trivy-frontend-report.json

      - name: Frontend Trivy summary
        run: |
          critical_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-frontend-report.json)
          {
            echo "## Trivy Summary - Frontend"
            echo ""
            echo "- Image Name: `${FRONTEND_IMAGE}`"
            echo "- Image Tag: `${IMAGE_TAG_SHA}`"
            echo "- Critical Findings: ${critical_count}"
            echo "- Hinweis: Details stehen im Trivy-Report-Artifact und im Trivy-Logscan."
          } >> "$GITHUB_STEP_SUMMARY"

      # Push the exact already-built image once the scan passed.
      - name: Push frontend image
        run: |
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"

  deploy-production:
    name: Deploy to Coolify (Production)
    runs-on: ubuntu-latest
    environment: production

    # Deploy only after at least one image job succeeded and none failed.
    needs:
      - changes
      - backend-image
      - frontend-image

    if: >-
      ${{
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.backend-image.result == 'success' || needs.backend-image.result == 'skipped') &&
      (needs.frontend-image.result == 'success' || needs.frontend-image.result == 'skipped') }}

    permissions:
      contents: read

    steps:
      - name: Deployment summary
        run: |
          echo "Deployment environment: production"
          echo "Backend changed: ${{ needs.changes.outputs.backend }}"
          echo "Frontend changed: ${{ needs.changes.outputs.frontend }}"

      - name: Trigger Coolify backend deploy webhook
        if: needs.changes.outputs.backend == 'true'
        env:
          COOLIFY_BACKEND_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_AUTH_TOKEN}" \
            "${COOLIFY_BACKEND_WEBHOOK}"

      - name: Trigger Coolify frontend deploy webhook
        if: needs.changes.outputs.frontend == 'true'
        env:
          COOLIFY_FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_AUTH_TOKEN}" \
            "${COOLIFY_FRONTEND_WEBHOOK}"
